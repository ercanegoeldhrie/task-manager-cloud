# Docker Compose : lance PLUSIEURS conteneurs qui travaillent ensemble, avec une seule commande.
#   docker compose up --build    -> démarre la base + l'API
#   docker compose down          -> arrête tout (les données restent dans le volume)
#   docker compose down -v       -> arrête tout ET efface les données
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskuser
      # Mot de passe de DÉVELOPPEMENT uniquement, sur ton PC. Dans le cloud (étape 7),
      # le vrai mot de passe sera rangé dans AWS Secrets Manager, jamais dans le code.
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"            # pour te connecter à la base depuis ton PC
    volumes:
      - db-data:/var/lib/postgresql/data   # les données survivent à l'arrêt du conteneur
    healthcheck:               # "la base est-elle prête à répondre ?"
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasks"]
      interval: 2s
      retries: 15

  api:
    build: ./app
    environment:
      # "db" est le nom du service ci-dessus : Compose crée un petit réseau privé
      # où chaque conteneur est joignable par son nom.
      DATABASE_URL: postgres://taskuser:devpassword@db:5432/tasks
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy   # attend que la base soit prête avant de lancer l'API

volumes:
  db-data:
